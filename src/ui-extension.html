<style>
  .red {
    color: #ff0000;
  }

  .green {
    color: #00ff7f;
  }

  .blue {
    color: #6495ed;
  }

  .yellow {
    color: #fafad2;
  }

  .magenta {
    color: #ee00ee;
  }

  .cyan {
    color: #00eeee;
  }

  .slateblue {
    color: #6d8be8;
  }

  .plum {
    color: #af99ef;
  }

  .salmon {
    color: #fa8072;
  }

  .orange {
    color: #ff7700;
  }

  .player {
    color: #fafad2;
  }

  .player.self {
    color: #ee00ee;
  }

  .item {
    color: #00eeee;
  }

  .item.progression {
    color: #af99ef;
  }

  .item.useful {
    color: #6d8be8;
  }

  .item.trap {
    color: #fa8072;
  }

  .location {
    color: #00ff7f;
  }

  .deathlink {
    color: #fa8072;
  }

  .item-entry.received {
    color: #00ff7f;
  }

  .location-entry.checked {
    color: #6d8be8;
    text-decoration: line-through;
    font-style: italic;
  }

  .arg {
    color: #6d8be8;
  }

  p {
    margin: 0;
  }

  .archipelago-message {
    line-height: 2.5rem;
  }

  .archipelago-message span {
    white-space: pre-wrap;
  }
</style>
<div style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
  <p style="width: 100%; color: pink">{{ sessions }}</p>
  <div class="chat-window-column m-6" style="border-radius: 8px; overflow: hidden;">
    <div class="p-6" style="display: flex; gap: 1.5rem">
      <input type="text" class="form-control ng-animate-disabled"
        placeholder="Server Hostname (eg. archipelago.gg:12345)" disable-variable-menu="true" ng-disabled="isConnecting"
        ng-model="hostname" ng-keydown="handleConnectKeydown($event)" style="flex: 1 0 40%" />
      <input type="text" class="form-control ng-animate-disabled" placeholder="Slot Name" disable-variable-menu="true"
        ng-disabled="isConnecting" ng-model="slot" ng-keydown="handleConnectKeydown($event)" />
      <input type="password" class="form-control ng-animate-disabled" placeholder="Password (optional)"
        disable-variable-menu="true" ng-disabled="isConnecting" ng-model="password"
        ng-keydown="handleConnectKeydown($event)" />
      <button class="btn btn-primary" ng-disabled="isConnecting" ng-click="connect()">
        <i class="fas fa-plus-circle" class="mr-2"></i> {{ isConnecting ? "Connecting" : "Connect" }}
      </button>
    </div>

    <div class="fb-tab-wrapper">
      <ul class="nav nav-tabs fb-tabs">
        <li ng-repeat="session in sessions track by $index" role="presentation"
          ng-class="{'active' : selectedSession === session.id}" ng-click="selectSlot(session.id)">
          <a href style="display: flex; align-items: center; gap: 10px;"><span>{{ session.handle }}</span><button
              class="close" ng-click="disconnect(session.id)"><i class="fal fa-times"
                style="display: flex; align-items: center; font-size: 14px; color: #66666655"></i></button></a>
        </li>
      </ul>
    </div>

    <div tab-index="-1" ng-click="scrollGlued = false" ng-blur="scrollGlued = true"
      style="display: flex; flex: 1; flex-direction: column; overflow-x: hidden; position: relative; font-size: 16px; color:#fff; background: rgba(0,0,0,0.65);cursor: default;">
      <div scroll-glue="scrollGlued" force-glue="forceGlued"
        style="display: flex; flex-direction: column; margin-top: auto; overflow-y: auto;">
        <div ng-repeat="message in messages[selectedSession] track by $index">
          <hr style="margin: 0; border-color: rgba(93, 93, 93, 0.2);" />
          <div class="p-3 archipelago-message" ng-bind-html="message"></div>
        </div>
      </div>
    </div>

    <div class="p-6" style="display: flex; gap: 1.5rem">
      <div class="hints-container" tooltip-placement="top"
        uib-tooltip="Hint Points: {{sessionData[selectedSession].hintPointProgress || '0'}} / {{sessionData[selectedSession].hintCost || '0'}}"
        style="flex-basis: 100px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span style="font-size: 16px; font-weight:600; letter-spacing: 0.075rem;">Hints: {{
          sessionData[selectedSession].hints || '0' }}</span>
        <uib-progressbar type="warning" class="progress-striped active" max="sessionData[selectedSession].hintCost || 1"
          value="sessionData[selectedSession].hintPointProgress || 0" style="margin: 0; width: 100%; height:10px;" />
      </div>
      <input type="text" class="form-control ng-animate-disabled" placeholder="Enter chat message or command"
        disable-variable-menu="true" ng-model="chatText" ng-keydown="handleChatKeydown($event)" style="flex: 1" />
      <button class="btn btn-primary" ng-click="sendMessage()">Send</button>
    </div>

  </div>
</div>
