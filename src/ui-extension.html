<style>
  .red {
    color: #ff0000;
  }

  .green {
    color: #00ff7f;
  }

  .blue {
    color: #6495ed;
  }

  .yellow {
    color: #fafad2;
  }

  .magenta {
    color: #ee00ee;
  }

  .cyan {
    color: #00eeee;
  }

  .slateblue {
    color: #6d8be8;
  }

  .plum {
    color: #af99ef;
  }

  .salmon {
    color: #fa8072;
  }

  .orange {
    color: #ff7700;
  }

  .player {
    color: #fafad2;
  }

  .player.self {
    color: #ee00ee;
  }

  .item {
    color: #00eeee;
  }

  .item.progression {
    color: #af99ef;
  }

  .item.useful {
    color: #6d8be8;
  }

  .item.trap {
    color: #fa8072;
  }

  .location {
    color: #00ff7f;
  }

  .deathlink {
    color: #fa8072;
  }

  .item-entry.received {
    color: #00ff7f;
  }

  .location-entry.checked {
    color: #6d8be8;
    text-decoration: line-through;
    font-style: italic;
  }

  .arg {
    color: #6d8be8;
  }

  p {
    margin: 0;
  }


  .chat-window-column {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-radius: 8px;
  }

  .archipelago-container {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }

  .archipelago-connection-panel {
    display: flex;
    gap: 1.5rem;
  }

  .archipelago-chat-wrapper {
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    font-size: 16px;
    color: #fff;
    background: rgba(0, 0, 0, 0.65);
    cursor: default;
  }

  .archipelago-chat-feed {
    display: flex;
    flex-direction: column;
    margin-top: auto;
    overflow: hidden auto;
  }

  .archipelago-chat-feed::-webkit-scrollbar {
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.75);
  }

  .archipelago-message {
    line-height: 2.5rem;
  }

  .archipelago-message span {
    white-space: pre-wrap;
  }
</style>
<div style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
  <div class="chat-window-column m-6">
    <div class="archipelago-connection-panel p-6">
      <input type="text" class="form-control ng-animate-disabled"
        placeholder="Server Hostname (eg. archipelago.gg:12345)" disable-variable-menu="true"
        ng-disabled="ui.isConnecting" ng-model="form.hostname" ng-keydown="handleConnectKeydown($event)"
        style="flex: 1 0 40%" />
      <input type="text" class="form-control ng-animate-disabled" placeholder="Slot Name" disable-variable-menu="true"
        ng-disabled="ui.isConnecting" ng-model="form.slot" ng-keydown="handleConnectKeydown($event)" />
      <input type="form.password" class="form-control ng-animate-disabled" placeholder="Password (optional)"
        disable-variable-menu="true" ng-disabled="ui.isConnecting" ng-model="password"
        ng-keydown="handleConnectKeydown($event)" />
      <button class="btn btn-primary" ng-disabled="ui.isConnecting" ng-click="connect()">
        <i class="fas fa-plus-circle" class="mr-2"></i> {{ ui.isConnecting ? "Connecting" : "Connect" }}
      </button>
    </div>

    <div class="fb-tab-wrapper">
      <ul class="nav nav-tabs fb-tabs">
        <li ng-repeat="session in sessions track by $index" role="presentation"
          ng-class="{'active' : currentSession.id === session.id}" ng-click="selectSlot(session.id)">
          <a href style="display: flex; align-items: center; gap: 10px;"><span>{{ session.handle }}</span><button
              class="close" ng-click="disconnect(session.id)"><i class="fal fa-times"
                style="display: flex; align-items: center; font-size: 14px; color: #66666655"></i></button></a>
        </li>
      </ul>
    </div>

    <!-- Disconnected View -->
    <div class="archipelago-container" ng-if="['disconnected', 'could-not-connect'].includes(currentSession.status)">
      <div style="display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center;">
        <h2>Disconnected</h2>
      </div>
    </div>

    <!-- Connected View -->
    <div class="archipelago-container" ng-if="currentSession.status === 'connected'">
      <div class="archipelago-chat-wrapper" tab-index="-1" ng-click="ui.scrollGlued = false"
        ng-blur="ui.scrollGlued = true">
        <div class="archipelago-chat-feed" scroll-glue="ui.scrollGlued" force-glue="ui.forceGlued">
          <div ng-repeat="message in messages[currentSession.id] track by $index">
            <hr style="margin: 0; border-color: rgba(93, 93, 93, 0.2);" />
            <div class="p-3 archipelago-message" ng-bind-html="message"></div>
          </div>
        </div>
      </div>

      <div class="p-6" style="display: flex; gap: 1.5rem">
        <div class="hints-container" tooltip-placement="top"
          uib-tooltip="Hint Points: {{sessionData[currentSession.id].hintPointProgress || '0'}} / {{sessionData[currentSession.id].hintCost || '0'}}"
          style="flex-basis: 100px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
          <span style="font-size: 16px; font-weight:600; letter-spacing: 0.075rem;">Hints: {{
            sessionData[currentSession.id].hints || '0' }}</span>
          <uib-progressbar type="warning" class="progress-striped active"
            max="sessionData[currentSession.id].hintCost || 1"
            value="sessionData[currentSession.id].hintPointProgress || 0"
            style="margin: 0; width: 100%; height:10px;" />
        </div>
        <input type="text" class="form-control ng-animate-disabled" placeholder="Enter chat message or command"
          disable-variable-menu="true" ng-model="form.chatText" ng-keydown="handleChatKeydown($event)"
          style="flex: 1" />
        <button class="btn btn-primary" ng-click="sendMessage()">Send</button>
      </div>
    </div>

  </div>
</div>
