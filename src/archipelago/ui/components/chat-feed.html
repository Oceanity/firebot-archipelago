<style>
  .red {
    color: #ff0000;
  }

  .green,
  .location,
  .item-entry.received {
    color: #00ff7f;
  }

  .blue {
    color: #6495ed;
  }

  .yellow,
  .player {
    color: #fafad2;
  }

  .magenta,
  .player.self {
    color: #ee00ee;
  }

  .cyan,
  .item {
    color: #00eeee;
  }

  .slateblue,
  .item.useful,
  .location-entry.checked,
  .arg {
    color: #6d8be8;
  }

  .plum,
  .item.progression {
    color: #af99ef;
  }

  .salmon,
  .item.trap,
  .deathlink {
    color: #fa8072;
  }

  .orange {
    color: #ff7700;
  }

  .location-entry.checked {
    text-decoration: line-through;
    font-style: italic;
  }

  archipelago-chat-feed {
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    font-size: 16px;
    color: #fff;
    background: rgba(0, 0, 0, 0.65);
    cursor: default;
  }

  .archipelago-chat-feed {
    display: flex;
    flex-direction: column;
    margin-top: auto;
    overflow: hidden auto;
  }

  .archipelago-chat-feed::-webkit-scrollbar {
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.75);
  }

  .archipelago-divider {
    margin: 0;
    border-color: rgba(93, 93, 93, 0.2);
  }

  .archipelago-message {
    line-height: 2.5rem;
  }

  .archipelago-message span {
    white-space: pre-wrap;
  }
</style>
<div class="archipelago-chat-feed" tab-index="-1" scroll-glue="$ctrl.glued && !$ctrl.focused"
  force-glue="$ctrl.forceGlued" ng-click="$ctrl.focused = false" ng-blur="$ctrl.focused = true">
  <div ng-repeat="message in $ctrl.messages track by $index">
    <hr class="archipelago-divider" />
    <div class="p-3 archipelago-message" ng-bind-html="message"></div>
  </div>
</div>
