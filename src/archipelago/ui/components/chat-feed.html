<style>
  archipelago-chat-feed {
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    font-size: 16px;
    color: #fff;
    background: rgba(0, 0, 0, 0.65);
    cursor: default;
  }

  archipelago-chat-feed p {
    margin: 0;
  }

  .archipelago-chat-feed {
    display: flex;
    flex-direction: column;
    margin-top: auto;
    overflow: hidden auto;
  }

  .archipelago-chat-feed::-webkit-scrollbar {
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.75);
  }

  .archipelago-divider {
    margin: 0;
    border-color: rgba(93, 93, 93, 0.2);
  }

  .archipelago-message {
    border-top: 1px solid rgba(93, 93, 93, 0.2);
    line-height: 2.5rem;
  }

  .archipelago-message span {
    white-space: pre-wrap;
  }
</style>
<div class="archipelago-chat-feed" tab-index="-1" scroll-glue="$ctrl.glued" force-glue="$ctrl.forceGlued"
  ng-click="$ctrl.glued = false" ng-blur="$ctrl.glued = true">
  <div ng-repeat="message in $ctrl.messages track by $index" class="p-3 archipelago-message" ng-bind-html="message">
  </div>
</div>
