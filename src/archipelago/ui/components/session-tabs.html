<style>
  archipelago-session-tabs .nav-tabs {
    display: flex;
    margin: 0;
  }

  .archipelago-session-tab {
    display: flex !important;
    align-items: center;
    gap: 10px;
  }

  .archipelago-session-tab .fal.fa-times {
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #66666655
  }
</style>
<div class="fb-tab-wrapper">
  <ul class="nav nav-tabs fb-tabs">
    <li ng-repeat="session in $ctrl.sessionTable track by $index" role="presentation"
      ng-class="{'active' : $ctrl.selected === session.id}" ng-click="$ctrl.changeSession(session.id)">
      <a href class="archipelago-session-tab"><span>{{ session.handle }}</span><button class="close"
          ng-click="$ctrl.disconnect(session.id)"><i class="fal fa-times"></i></button></a>
    </li>
  </ul>
</div>
